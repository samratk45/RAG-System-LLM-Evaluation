embedding_model:
  provider: "huggingface"          
  model_name: "BAAI/bge-small-en-v1.5"
  normalize: true



chunking:
  chunk_size: 750
  chunk_overlap: 80
  min_chunk_chars: 100

vector_store:
  type: "faiss"
  index_dir: "faiss_index"

retriever:
  top_k: 8
  search_type: "mmr"               
  fetch_k: 30                      
  lambda_mult: 0.7                 

active_llm: "groq"

llm:
  groq:
    provider: "groq"
    model_name: "openai/gpt-oss-20b"
    temperature: 0
    max_output_tokens: 4096

  google:
    provider: "google"
    model_name: "gemini-3.8-flash"  
    temperature: 0
    max_output_tokens: 2048